type: development
port: 8000
serverAddress: ''
# Motion sensors (tilt layer) are only available to pages served over https.
# Without certificate files, soundworks generates a self-signed certificate
# (browsers warn about it once); see the README to use trusted ones.
useHttps: true
crossOriginIsolated: true
httpsInfos:
  cert: null
  key: null
baseUrl: ''
auth:
  clients: []
  login: ''
  password: ''
